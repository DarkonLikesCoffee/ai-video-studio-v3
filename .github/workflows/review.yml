name: Review render

on:
  push:
    branches:
      - "review/**"

permissions:
  contents: read

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-review:
    if: contains(github.event.head_commit.message, 'composition=')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for optional Kokoro narration
        if: hashFiles('production/narration.json') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Kokoro model files
        if: hashFiles('production/narration.json') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ai-video-studio/kokoro-v1.0
          key: kokoro-onnx-0.6.1-model-files-v1.1-${{ runner.os }}
      - name: Install optional Kokoro dependencies
        if: hashFiles('production/narration.json') != ''
        run: python -m pip install --disable-pip-version-check -r requirements-tts.txt
      - name: Generate narration and word timings
        if: hashFiles('production/narration.json') != ''
        run: |
          python scripts/generate-narration.py \
            --config production/narration.json \
            --project-dir . \
            --model-dir "$HOME/.cache/ai-video-studio/kokoro-v1.0"
      - name: Read review inputs from commit message
        id: inputs
        shell: bash
        run: |
          MESSAGE="$(git log -1 --pretty=%B)"
          get_value() { printf '%s\n' "$MESSAGE" | grep -oE "$1=[^[:space:]]+" | tail -1 | cut -d= -f2-; }
          COMPOSITION="$(get_value composition)"
          FRAMES="$(get_value frames)"
          ROUND="$(get_value round)"
          FINAL="$(get_value final)"
          [[ "$COMPOSITION" =~ ^[A-Za-z0-9_-]+$ ]]
          test -n "$COMPOSITION" && test -n "$FRAMES" && test -n "$ROUND"
          [[ "$FRAMES" =~ ^[0-9,]+$ ]]
          [[ "$ROUND" =~ ^[0-9]+$ ]]
          [[ "$FINAL" == "true" || "$FINAL" == "false" ]]
          echo "composition=$COMPOSITION" >> "$GITHUB_OUTPUT"
          echo "frames=$FRAMES" >> "$GITHUB_OUTPUT"
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"
          echo "final=$FINAL" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check the project
        run: npm run check
      - name: Render selected still frames (swangle)
        env:
          REVIEW_ROUND: ${{ steps.inputs.outputs.round }}
        run: npm run still -- "${{ steps.inputs.outputs.composition }}" "${{ steps.inputs.outputs.frames }}"
      - name: Render contact sheet (swangle)
        run: npm run sheet -- "${{ steps.inputs.outputs.composition }}"
      - name: Render final MP4 (swangle), when requested
        if: steps.inputs.outputs.final == 'true'
        run: |
          mkdir -p out/review-artifacts
          /usr/bin/time -f "FINAL_MP4_RENDER_SECONDS=%e" -o out/review-artifacts/render-time.txt npm run render -- "${{ steps.inputs.outputs.composition }}"
          cp "out/${{ steps.inputs.outputs.composition }}.mp4" out/review-artifacts/
      - name: Master and validate final MP4 audio
        if: steps.inputs.outputs.final == 'true'
        env:
          COMPOSITION: ${{ steps.inputs.outputs.composition }}
        run: |
          VIDEO="out/$COMPOSITION.mp4"
          if ! ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$VIDEO" | grep -q '^audio        run: |
          mkdir -p out/review-artifacts
          cp -R "out/review/${{ steps.inputs.outputs.composition }}/${{ steps.inputs.outputs.round }}" out/review-artifacts/frames
          cp -R "out/review/${{ steps.inputs.outputs.composition }}/contact-sheet" out/review-artifacts/contact-sheet
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ steps.inputs.outputs.composition }}-round-${{ steps.inputs.outputs.round }}
          path: out/review-artifacts/
          if-no-files-found: error
          retention-days: 7
; then
            echo "Final MP4 has no audio stream." >&2
            exit 1
          fi
          ffmpeg -y -i "$VIDEO" \
            -af "loudnorm=I=-16:TP=-1.5:LRA=11" \
            -c:v copy -c:a aac -b:a 192k -movflags +faststart \
            "out/$COMPOSITION.mastered.mp4"
          mv "out/$COMPOSITION.mastered.mp4" "$VIDEO"
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,sample_rate,channels -of json "$VIDEO" > out/review-artifacts/media-probe.json
          ffmpeg -hide_banner -i "$VIDEO" -af ebur128=framelog=verbose -f null - 2> out/review-artifacts/audio-loudness.txt
          grep -E "Integrated loudness:|I:|LRA:" out/review-artifacts/audio-loudness.txt | tail -3 | tee out/review-artifacts/audio-validation.txt
          echo "Mastered MP4 and verified its audio/video streams." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect review images
        run: |
          mkdir -p out/review-artifacts
          cp -R "out/review/${{ steps.inputs.outputs.composition }}/${{ steps.inputs.outputs.round }}" out/review-artifacts/frames
          cp -R "out/review/${{ steps.inputs.outputs.composition }}/contact-sheet" out/review-artifacts/contact-sheet
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ steps.inputs.outputs.composition }}-round-${{ steps.inputs.outputs.round }}
          path: out/review-artifacts/
          if-no-files-found: error
          retention-days: 7
